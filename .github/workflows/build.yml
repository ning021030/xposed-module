name: Build Xposed Module

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Force Create Complete Android Project Structure
      run: |
        # 1. 强制在云端创建所有标准的物理目录结构
        mkdir -p app/src/main/java/com/example/module
        mkdir -p app/src/main/resources/META-INF/xposed
        
        # 2. 强制生成标准的 AndroidManifest.xml（含 LSPosed 识别所需的元数据）
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <application
                android:allowBackup="true"
                android:supportsRtl="true">
                
                <meta-data
                    android:name="xposedmodule"
                    android:value="true" />
                <meta-data
                    android:name="xposeddescription"
                    android:value="Apex Master Dynamic Scope" />
                <meta-data
                    android:name="xposedminversion"
                    android:value="54" />
            </application>
        </manifest>
        EOF

        # 3. 强制生成 Xposed 入口声明文件
        echo "com.example.module.MainModule" > app/src/main/resources/META-INF/xposed/java_init.list

        # 4. 强制生成 MainModule.java 源码
        cat << 'EOF' > app/src/main/java/com/example/module/MainModule.java
        package com.example.module;

        import de.robv.android.xposed.IXposedHookLoadPackage;
        import de.robv.android.xposed.XposedBridge;
        import de.robv.android.xposed.callbacks.XC_LoadPackage;

        public class MainModule implements IXposedHookLoadPackage {
            private static final String TAG = "ApexMasterEngine";

            @Override
            public void handleLoadPackage(XC_LoadPackage.LoadPackageParam lpparam) throws Throwable {
                if (lpparam.packageName == null || lpparam.packageName.startsWith("android") || lpparam.packageName.equals("system")) {
                    return;
                }
                XposedBridge.log(TAG + " 🛡️ Apex Master 引擎已挂载: " + lpparam.packageName);
            }
        }
        EOF

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.5

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
