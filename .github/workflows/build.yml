name: Build Xposed Module

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Scaffold Standard Android Project
      run: |
        # 1. 彻底清空当前目录杂乱的文件，重新构建规范的单模块结构
        rm -rf app settings.gradle build.gradle
        
        mkdir -p app/src/main/java/com/example/module
        mkdir -p app/src/main/resources/META-INF/xposed

        # 2. 写入根目录 settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
                maven { url 'https://api.xposed.info/' }
            }
        }
        rootProject.name = "ApexMasterEngine"
        include ':app'
        EOF

        # 3. 写入根目录 build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.0'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # 4. 写入 app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.example.module'
            compileSdk 34

            defaultConfig {
                applicationId "com.example.module"
                minSdk 24
                targetSdk 34
                versionCode 100
                versionName "2.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            compileOnly 'de.robv.android.xposed:api:82'
        }
        EOF

        # 5. 写入 AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:supportsRtl="true">
                <meta-data
                    android:name="xposedmodule"
                    android:value="true" />
                <meta-data
                    android:name="xposeddescription"
                    android:value="Apex Master Dynamic Scope" />
                <meta-data
                    android:name="xposedminversion"
                    android:value="54" />
            </application>
        </manifest>
        EOF

        # 6. 写入 Xposed 入口
        echo "com.example.module.MainModule" > app/src/main/resources/META-INF/xposed/java_init.list

        # 7. 写入 Java 源码
        cat << 'EOF' > app/src/main/java/com/example/module/MainModule.java
        package com.example.module;

        import de.robv.android.xposed.IXposedHookLoadPackage;
        import de.robv.android.xposed.XposedBridge;
        import de.robv.android.xposed.callbacks.XC_LoadPackage;

        public class MainModule implements IXposedHookLoadPackage {
            private static final String TAG = "ApexMasterEngine";

            @Override
            public void handleLoadPackage(XC_LoadPackage.LoadPackageParam lpparam) throws Throwable {
                if (lpparam.packageName == null || lpparam.packageName.startsWith("android") || lpparam.packageName.equals("system")) {
                    return;
                }
                XposedBridge.log(TAG + " 🛡️ Apex Master 引擎已挂载: " + lpparam.packageName);
            }
        }
        EOF

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.5

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
